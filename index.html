<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Spotlight Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #09090b;
      background-image: radial-gradient(circle at 50% 50%, #18181b 0%, #09090b 100%);
      perspective: 1000px;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 340px;
      height: 440px;
      background: rgba(24, 24, 27, 0.8);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      cursor: pointer;
      overflow: hidden;
    }

    /* Mouse-tracking glow layer */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(56, 189, 248, 0.25),
        transparent 60%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:hover::before {
      opacity: 1;
    }

    /* Floating 3D inner elements */
    .card-content {
      transform: translateZ(40px);
      pointer-events: none;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h2 {
      font-size: 1.85rem;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #a1a1aa;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .card-footer {
      transform: translateZ(30px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.25rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #e4e4e7;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="card" id="tiltCard">
    <div class="card-content">
      <span class="badge">Interactive UI</span>
      <h2>3D Glass & Spotlight</h2>
      <p>Move your cursor across this card to see real-time 3D perspective tilting paired with a dynamic radial light source.</p>
    </div>

    <div class="card-footer">
      <div class="status">
        <span class="dot"></span>
        <span>Pure HTML/CSS/JS</span>
      </div>
      <span style="color: #38bdf8; font-weight: bold;">&rarr;</span>
    </div>
  </div>

  <script>
    const card = document.getElementById('tiltCard');

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Update CSS variables for the spotlight position
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);

      // Calculate 3D rotation angles
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -12; // Max 12deg tilt
      const rotateY = ((x - centerX) / centerX) * 12;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    // Reset smoothly when mouse leaves
    card.addEventListener('mouseleave', () => {
      card.style.transition = 'transform 0.5s ease';
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    // Remove slow transition when mouse re-enters for snappy tracking
    card.addEventListener('mouseenter', () => {
      card.style.transition = 'transform 0.1s ease-out';
    });
  </script>

</body>
</html>
